services:
  stats-db:
    image: postgres:16
    container_name: stats-db
    environment:
      POSTGRES_DB: later
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diplom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d later"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-server:
    build: ./stats-server  # Упрощено до обычной строки
    container_name: stats-server
    depends_on:
      stats-db:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/later
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: diplom

  ewm-db:
    image: postgres:16
    container_name: ewm-db
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diplom
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ewm"]
      interval: 5s
      timeout: 5s
      retries: 10

  ewm-service:
    build: ./ewm-service  # Исправлено на ewm-service (или evm-service, в зависимости от имени вашей папки)
    container_name: ewm-service
    depends_on:
      ewm-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: diplom
      STATS_SERVER_URL: http://stats-server:9090
    command: [ "./wait-for-it.sh", "stats-server:9090", "java", "-jar", "app.jar" ]


